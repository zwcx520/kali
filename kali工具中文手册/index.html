    scrollPosition: 0,         // Save scroll position for back navigation
};

// === View Stack (non-route back navigation) ===
// Instead of using browser history (history.back()), we use an internal
// view stack to track navigation. This provides APP-style back behavior
// without changing the URL.
const viewStack = [];

function pushView(viewData) {
    viewStack.push({
        view: state.currentView,
        category: state.currentCategory,
        page: state.currentPage,
        searchQuery: state.searchQuery,
        scrollY: window.scrollY,
        toolName: state.currentToolName,
    });
}

function popView() {
    if (viewStack.length === 0) return false;

    const prev = viewStack.pop();

    // Close whatever is CURRENTLY open (not what we're going back to)
    if (state.currentView === 'modal') {
        const modal = document.getElementById('modalOverlay');
        modal.classList.remove('show', 'active');
        document.body.style.overflow = '';
    } else if (state.currentView === 'search') {
        document.getElementById('mobileSearchOverlay').classList.remove('active');
    } else if (state.currentView === 'category') {
        document.getElementById('mobileCategorySheet').classList.remove('active');
        document.getElementById('sheetOverlay').classList.remove('active');
    }

    // Restore previous state
    state.currentView = prev.view;
    state.currentToolName = prev.toolName || '';
    state.currentCategory = prev.category;
    state.currentPage = prev.page;
    state.searchQuery = prev.searchQuery || '';

    // Restore search inputs
    const searchInput = document.getElementById('searchInput');
    const mobileSearchInput = document.getElementById('mobileSearchInput');
    if (searchInput) searchInput.value = state.searchQuery;
    if (mobileSearchInput) mobileSearchInput.value = state.searchQuery;

    // Update category UI
    updateCategoryUI(state.currentCategory);

    // Re-filter and render
    filterTools();

    // Update mobile UI
    updateMobileUI();

    // Restore scroll position
    setTimeout(() => {
        window.scrollTo({ top: prev.scrollY, behavior: 'instant' });
    }, 50);

    return true;
}

function updateMobileUI() {
    const isMobile = window.innerWidth <= CONFIG.MOBILE_BREAKPOINT;
    const pageTitle = document.getElementById('mobilePageTitle');

    if (!isMobile) {
        pageTitle.style.display = 'none';
        return;
    }

    // Update page title
    let title = '首页';
    if (state.currentView === 'modal' && state.currentToolName) {
        title = state.currentToolName;
    } else if (state.currentView === 'search') {
        title = '搜索';
    } else if (state.currentView === 'category') {
        title = '分类';
    } else if (state.currentCategory !== 'all') {
        const cat = state.metadata?.categories.find(c => c.key === state.currentCategory);
        title = cat ? cat.cn : '首页';
    } else if (state.searchQuery) {
        title = `"${state.searchQuery}"`;
    }
    pageTitle.textContent = title;

    // Update bottom nav active state
    document.querySelectorAll('.mobile-bottom-nav .nav-item').forEach(item => {
        item.classList.remove('active');
    });
    if (state.currentView === 'home' || state.currentView === 'modal') {
        document.getElementById('navHome').classList.add('active');
    } else if (state.currentView === 'search') {
        document.getElementById('navSearch').classList.add('active');
    } else if (state.currentView === 'category') {
        document.getElementById('navCategory').classList.add('active');
    }
}

// === Initialize ===
function init() {
    try {
        // Load metadata from JS global (no fetch needed, works with file://)
        if (typeof window.KALI_METADATA === 'undefined') {
            throw new Error('metadata.js not loaded');
        }
        state.metadata = window.KALI_METADATA;

        // Update stats
        document.getElementById('totalTools').textContent = state.metadata.total_tools;
        document.getElementById('totalCats').textContent = state.metadata.categories.length;
        document.getElementById('heroTools').textContent = state.metadata.total_tools + '+';
        document.getElementById('heroCats').textContent = state.metadata.categories.length;
        document.getElementById('countAll').textContent = state.metadata.total_tools;
        document.getElementById('footerCount').textContent = state.metadata.total_tools;

        // Render sidebar categories (desktop)
        renderCategories(state.metadata.categories);

        // Render mobile category sheet
        renderMobileCategories(state.metadata.categories);

        // Load all data chunks from JS globals
        loadAllChunks();

        // Initial render
        state.filteredTools = [...state.allTools];
        renderTools();

        // Update mobile UI
        updateMobileUI();

    } catch (error) {
        console.error('Initialization error:', error);
        document.getElementById('toolsContainer').innerHTML = `
            <div class="no-results">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>数据加载失败</h3>
                <p>请确保 data/ 目录下的 JS 文件完整</p>
            </div>
        `;
    }
}

// === Load Data Chunks ===
function loadAllChunks() {
    const totalChunks = state.metadata.total_chunks;

    for (let i = 0; i < totalChunks; i++) {
        const chunkId = String(i).padStart(2, '0');
        const globalVar = `KALI_TOOLS_${chunkId}`;

        if (typeof window[globalVar] !== 'undefined') {
            state.allTools.push(...window[globalVar]);
            state.loadedChunks.add(chunkId);
        } else {
            console.error(`Failed to load chunk ${chunkId}: ${globalVar} not found`);
        }
    }

    // Sort all tools by name
    state.allTools.sort((a, b) => a.n.toLowerCase().localeCompare(b.n.toLowerCase()));
}

// === Render Categories (Desktop Sidebar) ===
function renderCategories(categories) {
    const container = document.getElementById('categoryList');

    // Sort categories by count (descending)
    categories.sort((a, b) => b.count - a.count);

    container.innerHTML = categories.map(cat => `
        <div class="cat-item" data-category="${cat.key}">
            <div class="cat-icon"><i class="fas ${cat.icon}"></i></div>
            <span>${cat.cn}</span>
            <span class="cat-count">${cat.count}</span>
        </div>
    `).join('');

    // Add click handlers
    document.querySelectorAll('.cat-item[data-category]').forEach(item => {
        item.addEventListener('click', () => {
            const cat = item.dataset.category;
            selectCategory(cat);
        });
    });
}

// === Render Mobile Categories (Bottom Sheet) ===
function renderMobileCategories(categories) {
    const container = document.getElementById('mobileCategoryGrid');

    let html = `
        <div class="sheet-cat-item active" data-category="all">
            <div class="cat-icon-sm"><i class="fas fa-th"></i></div>
            <span class="cat-name-sm">全部工具</span>
            <span class="cat-count-sm">${state.metadata.total_tools}</span>
        </div>
    `;

    html += categories.map(cat => `
        <div class="sheet-cat-item" data-category="${cat.key}">
            <div class="cat-icon-sm"><i class="fas ${cat.icon}"></i></div>
            <span class="cat-name-sm">${cat.cn}</span>
            <span class="cat-count-sm">${cat.count}</span>
        </div>
    `).join('');

    container.innerHTML = html;

    // Add click handlers
    container.querySelectorAll('.sheet-cat-item').forEach(item => {
        item.addEventListener('click', () => {

// === Update Category UI ===
function updateCategoryUI(category) {
    // Update desktop sidebar
    document.querySelectorAll('.cat-item').forEach(item => {
        item.classList.toggle('active', item.dataset.category === category);
    });

    // Update mobile sheet
    document.querySelectorAll('.sheet-cat-item').forEach(item => {
        item.classList.toggle('active', item.dataset.category === category);
    });

    // Update current category display
    const catItem = document.querySelector(`.cat-item[data-category="${category}"]`);
    if (catItem) {
        const iconHtml = catItem.querySelector('.cat-icon').innerHTML;
        const iconMatch = iconHtml.match(/fa-[a-z-]+/);
        const iconClass = iconMatch ? iconMatch[0] : 'fa-th';
        const name = catItem.querySelector('span').textContent;
        document.getElementById('currentCategory').innerHTML = `<i class="fas ${iconClass}"></i> <span>${name}</span>`;
    }
}

// === Category Selection ===
function selectCategory(category) {
    // Push current view to stack if category is changing
    if (category !== state.currentCategory) {
        pushView();
    }

    state.currentCategory = category;
    state.currentPage = 1;
    state.currentView = 'home';

    updateCategoryUI(category);

    // Close mobile sidebar
    closeSidebar();

    // Re-filter and render
    filterTools();

    // Update mobile UI
    updateMobileUI();

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// === Filter Tools ===
function filterTools() {
    let filtered = state.allTools;

    // Category filter
    if (state.currentCategory !== 'all') {
        filtered = filtered.filter(t => t.c === state.currentCategory);
    }

    // Search filter - traversal search across ALL fields
    if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        const qWords = q.split(/\s+/).filter(w => w.length > 0);

        filtered = filtered.filter(t => {
            // Build searchable text from all fields
            const searchText = [
                t.n || '',           // name
                t.s || '',            // slug
                t.de || '',          // description EN
                t.dc || '',          // description CN
                t.cc || '',          // category CN
                t.ce || '',           // category EN
                t.c || '',            // category key
            ].join(' ').toLowerCase();

            // Usage examples
            let usageText = '';
            if (t.ue && t.ue.length > 0) {
                usageText = t.ue.map(item => {
                    if (typeof item === 'string') return item;
                    return (item.cmd || '') + ' ' + (item.explanation || '');
                }).join(' ');
            }

            // Tutorial content
            const tutorialText = (t.tc || '').toLowerCase();

            // Match: ALL words must be found somewhere
            return qWords.every(word =>
                searchText.includes(word) ||
                usageText.toLowerCase().includes(word) ||
                tutorialText.includes(word)
            );
        });
    }

    // Sort
    if (state.sortBy === 'name') {
        filtered.sort((a, b) => a.n.toLowerCase().localeCompare(b.n.toLowerCase()));
    } else if (state.sortBy === 'category') {
        filtered.sort((a, b) => a.cc.localeCompare(b.cc) || a.n.toLowerCase().localeCompare(b.n.toLowerCase()));
    }

    state.filteredTools = filtered;
    state.currentPage = 1;
    renderTools();
}

// === Highlight search match ===
function highlightMatch(text, query) {
    if (!query || !text) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const qWords = query.trim().split(/\s+/).filter(w => w.length > 0);
    if (qWords.length === 0) return escaped;
    
    let result = escaped;
    qWords.forEach(word => {
        if (word.length < 1) return;
        // Escape regex special chars
        const safeWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp('(' + safeWord + ')', 'gi');
        result = result.replace(regex, '<mark class="search-highlight">$1</mark>');
    });
    return result;
}

// === Render Tools ===
function renderTools() {
    const container = document.getElementById('toolsContainer');
    const total = state.filteredTools.length;

    if (total === 0) {
        container.innerHTML = `
            <div class="no-results">
                <i class="fas fa-search"></i>
                <h3>未找到匹配的工具</h3>
                <p>请尝试其他关键词或分类</p>
            </div>
        `;
        document.getElementById('pagination').style.display = 'none';
        return;
    }

    // Pagination
    const start = (state.currentPage - 1) * CONFIG.PAGE_SIZE;
    const end = start + CONFIG.PAGE_SIZE;
    const pageTools = state.filteredTools.slice(start, end);

    // Render
    const viewClass = state.viewMode === 'grid' ? 'tools-grid' : 'tools-list';

    container.innerHTML = `<div class="${viewClass}">` + pageTools.map(tool => renderToolCard(tool)).join('') + '</div>';

    // Add click handlers
    document.querySelectorAll('.tool-card').forEach(card => {
        card.addEventListener('click', () => {
            const slug = card.dataset.slug;
            const tool = state.allTools.find(t => t.s === slug);
            if (tool) showToolDetail(tool);
        });
    });

    // Render pagination
    renderPagination(total);
}

// === Render Tool Card ===
function renderToolCard(tool) {
    const hasUsage = tool.ue && tool.ue.length > 0;
    const descEn = tool.de || '';
    const descCn = tool.dc || '';
    const desc = descCn || descEn || '暂无描述';
    const q = state.searchQuery;

    return `
        <div class="tool-card" data-slug="${tool.s}">
            <div class="tool-card-header">
                <div class="tool-card-icon">
                    <i class="fas ${tool.ci || 'fa-terminal'}"></i>
                </div>
                <div class="tool-card-info">
                    <div class="tool-card-name">${highlightMatch(tool.n, q)}</div>
                    <div class="tool-card-cat">
                        <span class="cat-badge">${highlightMatch(tool.cc, q)}</span>
                    </div>
                </div>
            </div>
            <p class="tool-card-desc">${highlightMatch(desc.substring(0, 120), q)}${desc.length > 120 ? '...' : ''}</p>
            <div class="tool-card-footer">
                <div class="tool-card-tags">
                    <span class="tool-tag">CLI</span>
                    ${hasUsage ? '<span class="tool-tag has-usage">有示例</span>' : ''}
                </div>
                <div class="tool-card-link">
                    <i class="fas fa-arrow-right"></i> 查看教程
                </div>
            </div>
        </div>
    `;
}

// === Render Pagination ===
function renderPagination(total) {
    const container = document.getElementById('pagination');
    const totalPages = Math.ceil(total / CONFIG.PAGE_SIZE);

    if (totalPages <= 1) {
        container.style.display = 'none';
        return;
    }

    container.style.display = 'flex';

    let html = '';

    // Prev button
    html += `<button class="page-btn" ${state.currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${state.currentPage - 1})">
        <i class="fas fa-chevron-left"></i>
    </button>`;

    // Page numbers
    let startPage = Math.max(1, state.currentPage - 2);
    let endPage = Math.min(totalPages, state.currentPage + 2);

    if (startPage > 1) {
        html += `<button class="page-btn" onclick="goToPage(1)">1</button>`;
        if (startPage > 2) html += `<span style="color:var(--muted);padding:0 4px;">...</span>`;
    }

    for (let i = startPage; i <= endPage; i++) {
        html += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    }

    if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<span style="color:var(--muted);padding:0 4px;">...</span>`;
        html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
    }

    // Next button
    html += `<button class="page-btn" ${state.currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${state.currentPage + 1})">
        <i class="fas fa-chevron-right"></i>
    </button>`;

    container.innerHTML = html;
}

function goToPage(page) {
    state.currentPage = page;
    renderTools();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// === Show Tool Detail (opens APP-style modal) ===
function showToolDetail(tool) {
    // Save current view state to stack (non-route navigation)
    pushView();
    state.currentView = 'modal';
    state.currentToolName = tool.n;

    const modal = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');

    // Parse tutorial markdown to HTML
    const tutorialHtml = parseTutorialMarkdown(tool.tc || '');

    // Build usage examples HTML
    let usageHtml = '';
    if (tool.ue && tool.ue.length > 0) {
        usageHtml = tool.ue.map((item, i) => {
            // Handle both old (string) and new (object) format
            const cmd = typeof item === 'string' ? item : (item.cmd || '');
            const explanation = typeof item === 'string' ? '' : (item.explanation || '');

            return `
            <div class="code-block">
                <div class="code-block-header">
                    <span><i class="fas fa-terminal"></i> 示例 ${i + 1}</span>
                    <button class="copy-btn" onclick="copyCode(this, ${i})">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                </div>
                <pre><code>${escapeHtml(cmd)}</code></pre>
                ${explanation ? `
                <div class="code-explanation">
                    <i class="fas fa-lightbulb expl-icon"></i>
                    <div class="expl-text"><strong>中文解释：</strong>${escapeHtml(explanation)}</div>
                </div>
                ` : ''}
            </div>
            `;
        }).join('');
    } else {
        usageHtml = '<p style="color:var(--muted);">暂无使用示例。请使用 <code>--help</code> 参数查看帮助信息。</p>';
    }

    content.innerHTML = `
        <div class="modal-header">
            <div class="tool-icon-large">
                <i class="fas ${tool.ci || 'fa-terminal'}"></i>
            </div>
            <div style="flex:1;min-width:0;">
                <h2>${escapeHtml(tool.n)}</h2>
                <div class="modal-cat">
                    <span class="cat-badge" style="background:var(--bg3);padding:2px 8px;border-radius:10px;font-size:12px;">${tool.cc}</span>
                    <span style="margin-left:8px;">${tool.ce}</span>
                </div>
            </div>
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <!-- Chinese Description -->
            <div class="modal-section">
                <h3><i class="fas fa-info-circle"></i> 工具简介</h3>
                <div class="desc-cn">${escapeHtml(tool.dc || '暂无描述')}</div>
            </div>

            ${tool.de ? `
            <div class="modal-section">
                <h3><i class="fas fa-file-alt"></i> 官方描述（英文）</h3>
                <div class="desc-en">${escapeHtml(tool.de)}</div>
            </div>
            ` : ''}

            <!-- Installation -->
            <div class="modal-section">
                <h3><i class="fas fa-download"></i> 安装方法</h3>
                <div class="install-cmd">
                    <code>sudo apt update && sudo apt install ${tool.s}</code>
                    <button class="copy-btn" onclick="copyInstallCmd(this, '${tool.s}')">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                </div>
            </div>

            <!-- Usage Examples -->
            <div class="modal-section">
                <h3><i class="fas fa-terminal"></i> 使用示例</h3>
                ${usageHtml}
            </div>

            <!-- Tutorial -->
            <div class="modal-section">
                <h3><i class="fas fa-graduation-cap"></i> 中文教程</h3>
                <div class="tutorial-content">${tutorialHtml}</div>
            </div>

            <!-- External Link -->
            <div class="modal-section">
                <a href="${tool.u}" target="_blank" class="external-link">
                    <i class="fas fa-external-link-alt"></i>
                    查看官方文档
                </a>
            </div>
        </div>
    `;

    modal.classList.add('active');
    setTimeout(() => modal.classList.add('show'), 10);
    document.body.style.overflow = 'hidden';

    // Update mobile UI (show back button, update title)
    updateMobileUI();
}

function closeModal() {
    // Just call popView - it handles closing the modal and restoring state
    popView();
}

// === Mobile Search ===
function openMobileSearch() {
    pushView();
    state.currentView = 'search';

    const overlay = document.getElementById('mobileSearchOverlay');
    overlay.classList.add('active');

    const input = document.getElementById('mobileSearchInput');
    input.value = state.searchQuery || '';

    // Show clear button if there's existing query
    const msClearBtn = document.getElementById('msClear');
    if (state.searchQuery) {
        msClearBtn.classList.add('visible');
    } else {
        msClearBtn.classList.remove('visible');
    }

    setTimeout(() => input.focus(), 250);

    // Show initial state or render existing results
    renderSearchResults();

    updateMobileUI();
}

function closeMobileSearch() {
    const overlay = document.getElementById('mobileSearchOverlay');
    overlay.classList.remove('active');
    state.currentView = 'home';
    updateMobileUI();
}

// === Render Search Results in Overlay ===
function renderSearchResults() {
    const container = document.getElementById('msResults');
    const query = state.searchQuery || '';

    // No query — show prompt
    if (!query.trim()) {
        container.innerHTML = `
            <div class="ms-empty">
                <i class="fas fa-keyboard"></i>
                <h3>输入关键词搜索</h3>
                <p>支持工具名称、描述、分类、命令等</p>
            </div>
        `;
        return;
    }

    // Run filter (search across all fields)
    let filtered = state.allTools;
    const q = query.toLowerCase();
    const qWords = q.split(/\s+/).filter(w => w.length > 0);

    filtered = filtered.filter(t => {
        const searchText = [
            t.n || '', t.s || '', t.de || '', t.dc || '',
            t.cc || '', t.ce || '', t.c || ''
        ].join(' ').toLowerCase();

        let usageText = '';
        if (t.ue && t.ue.length > 0) {
            usageText = t.ue.map(item => {
                if (typeof item === 'string') return item;
                return (item.cmd || '') + ' ' + (item.explanation || '');
            }).join(' ');
        }
        const tutorialText = (t.tc || '').toLowerCase();

        return qWords.every(word =>
            searchText.includes(word) ||
            usageText.toLowerCase().includes(word) ||
            tutorialText.includes(word)
        );
    });

    // Sort by relevance: name match first
    filtered.sort((a, b) => {
        const aName = (a.n || '').toLowerCase();
        const bName = (b.n || '').toLowerCase();
        const aStarts = aName.startsWith(q);
        const bStarts = bName.startsWith(q);
        if (aStarts && !bStarts) return -1;
        if (!aStarts && bStarts) return 1;
        return aName.localeCompare(bName);
    });

    state.filteredTools = filtered;

    const total = filtered.length;
    const displayLimit = 100;
    const displayTools = filtered.slice(0, displayLimit);

    if (total === 0) {
        container.innerHTML = `
            <div class="ms-empty">
                <i class="fas fa-search"></i>
                <h3>未找到匹配结果</h3>
                <p>没有与"${escapeHtml(query)}"匹配的工具</p>
            </div>
        `;
        return;
    }

    container.innerHTML = `
        <div class="ms-result-count">找到 ${total} 个匹配结果${total > displayLimit ? `（显示前 ${displayLimit} 个）` : ''}</div>
        <div class="ms-results-list">
            ${displayTools.map(tool => {
                const nameHtml = highlightMatch(tool.n, query);
                const descHtml = highlightMatch(tool.dc || tool.de || '', query);
                const catHtml = highlightMatch(tool.cc || '', query);
                const icon = tool.ci || 'fa-terminal';
                return `
                    <div class="ms-result-item" data-slug="${tool.s}">
                        <div class="ms-result-icon">
                            <i class="fas ${icon}"></i>
                        </div>
                        <div class="ms-result-info">
                            <div class="ms-result-name">${nameHtml}</div>
                            <div class="ms-result-desc">${descHtml}</div>
                        </div>
                        <span class="ms-result-cat">${catHtml}</span>
                    </div>
                `;
            }).join('')}
        </div>
    `;

    // Add click handlers to results
    container.querySelectorAll('.ms-result-item').forEach(item => {
        item.addEventListener('click', () => {
            const slug = item.dataset.slug;
            const tool = state.allTools.find(t => t.s === slug);
            if (tool) {
                // Pop search view from stack, then open tool detail
                popView();
                showToolDetail(tool);
            }
        });
    });
}

// === Mobile Category Sheet ===
function openMobileCategorySheet() {
    pushView();
    state.currentView = 'category';

    const sheet = document.getElementById('mobileCategorySheet');
    const overlay = document.getElementById('sheetOverlay');
    sheet.classList.add('active');
    overlay.classList.add('active');

    updateMobileUI();
}

function closeMobileCategorySheet() {
    const sheet = document.getElementById('mobileCategorySheet');
    const overlay = document.getElementById('sheetOverlay');
    sheet.classList.remove('active');
    overlay.classList.remove('active');
    state.currentView = 'home';
    updateMobileUI();
}

// === Parse Tutorial Markdown ===
function parseTutorialMarkdown(md) {
    if (!md) return '<p>暂无教程内容。</p>';

    let html = md;

    // Code blocks
    html = html.replace(/```bash\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    html = html.replace(/```\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

    // Headers
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');

    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // List items
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.+<\/li>\n?)+/g, '<ul>$&</ul>');

    // Paragraphs (remaining text)
    html = html.replace(/\n\n/g, '</p><p>');
    html = '<p>' + html + '</p>';

    // Clean up
    html = html.replace(/<p><h2>/g, '<h2>');
    html = html.replace(/<\/h2><\/p>/g, '</h2>');
    html = html.replace(/<p><h3>/g, '<h3>');
    html = html.replace(/<\/h3><\/p>/g, '</h3>');
    html = html.replace(/<p><pre>/g, '<pre>');
    html = html.replace(/<\/pre><\/p>/g, '</pre>');
    html = html.replace(/<p><ul>/g, '<ul>');
    html = html.replace(/<\/ul><\/p>/g, '</ul>');

    return html;
}

// === Copy Functions ===
function copyCode(btn, index) {
    const pre = btn.closest('.code-block').querySelector('pre code');
    const text = pre.textContent;
    navigator.clipboard.writeText(text).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
        }, 2000);
    });
}

function copyInstallCmd(btn, slug) {
    const cmd = `sudo apt update && sudo apt install ${slug}`;
    navigator.clipboard.writeText(cmd).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<i class="fas fa-check"></i> 已复制';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fas fa-copy"></i> 复制';
        }, 2000);
    });
}

// === Utility ===
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// === Event Listeners ===
document.addEventListener('DOMContentLoaded', () => {
    // Desktop search input
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            state.searchQuery = e.target.value.trim();
            filterTools();
            updateMobileUI();
        }, 300);
    });

    // Mobile search input
    let mobileSearchTimer;
    const msInput = document.getElementById('mobileSearchInput');
    const msClearBtn = document.getElementById('msClear');

    msInput.addEventListener('input', (e) => {
        // Show/hide clear button
        if (e.target.value.trim()) {
            msClearBtn.classList.add('visible');
        } else {
            msClearBtn.classList.remove('visible');
        }
        clearTimeout(mobileSearchTimer);
        mobileSearchTimer = setTimeout(() => {
            state.searchQuery = e.target.value.trim();
            state.currentPage = 1;
            renderSearchResults();
        }, 200);
    });

    // Clear button
    msClearBtn.addEventListener('click', () => {
        msInput.value = '';
        msClearBtn.classList.remove('visible');
        state.searchQuery = '';
        msInput.focus();
        renderSearchResults();
    });

    // Mobile search cancel button
    document.getElementById('msCancel').addEventListener('click', () => {
        popView();
    });

    // Sort select
    document.getElementById('sortSelect').addEventListener('change', (e) => {
        state.sortBy = e.target.value;
        filterTools();
    });

    // View toggle
    document.getElementById('gridViewBtn').addEventListener('click', () => {
        state.viewMode = 'grid';
        document.getElementById('gridViewBtn').classList.add('active');
        document.getElementById('listViewBtn').classList.remove('active');
        renderTools();
    });

    document.getElementById('listViewBtn').addEventListener('click', () => {
        state.viewMode = 'list';
        document.getElementById('listViewBtn').classList.add('active');
        document.getElementById('gridViewBtn').classList.remove('active');
        renderTools();
    });

    // Modal close on overlay click
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modalOverlay') closeModal();
    });

    // ESC to close modal
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (document.getElementById('modalOverlay').classList.contains('active')) {
                closeModal();
            } else if (document.getElementById('mobileSearchOverlay').classList.contains('active')) {
                popView();
            } else if (document.getElementById('mobileCategorySheet').classList.contains('active')) {
                popView();
            }
        }
    });

    // Mobile sidebar toggle (legacy, for desktop drawer)
    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    });

    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    // Back to top
    window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTop');
        if (window.scrollY > 400) {
            btn.classList.add('visible');
        } else {
            btn.classList.remove('visible');
        }
    });

    document.getElementById('backToTop').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // "All tools" category click
    document.querySelector('.cat-item[data-category="all"]').addEventListener('click', () => {
        selectCategory('all');
    });

    // === Mobile Bottom Navigation ===
    document.getElementById('navHome').addEventListener('click', () => {
        // Close whatever is currently open
        if (state.currentView === 'modal') {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('show', 'active');
            document.body.style.overflow = '';
        } else if (state.currentView === 'search') {
            document.getElementById('mobileSearchOverlay').classList.remove('active');
        } else if (state.currentView === 'category') {
            document.getElementById('mobileCategorySheet').classList.remove('active');
            document.getElementById('sheetOverlay').classList.remove('active');
        }

        // Clear the entire view stack
        viewStack.length = 0;

        // Reset to home
        state.currentView = 'home';
        state.currentToolName = '';
        state.currentCategory = 'all';
        state.searchQuery = '';
        state.currentPage = 1;

        // Clear search inputs
        const searchInput = document.getElementById('searchInput');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        if (searchInput) searchInput.value = '';
        if (mobileSearchInput) mobileSearchInput.value = '';
        const msClearBtnHome = document.getElementById('msClear');
        if (msClearBtnHome) msClearBtnHome.classList.remove('visible');

        // Update UI
        updateCategoryUI('all');
        filterTools();
        updateMobileUI();

        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('navCategory').addEventListener('click', () => {
        if (state.currentView === 'category') {
            closeMobileCategorySheet();
        } else {
            openMobileCategorySheet();
        }
    });

    document.getElementById('navSearch').addEventListener('click', () => {
        if (state.currentView === 'search') {
            popView();
        } else {
            openMobileSearch();
        }
    });

    document.getElementById('navAbout').addEventListener('click', () => {
        // Scroll to footer
        const footer = document.querySelector('.app-footer');
        if (footer) {
            footer.scrollIntoView({ behavior: 'smooth' });
        }
    });

    // Mobile category sheet close
    document.getElementById('sheetClose').addEventListener('click', () => {
        popView();
    });

    document.getElementById('sheetOverlay').addEventListener('click', () => {
        popView();
    });

    // Handle window resize
    window.addEventListener('resize', () => {
        updateMobileUI();
    });

    // Prevent browser back button from leaving the page when in a modal/view
    // Instead, use our internal view stack
    window.addEventListener('popstate', (e) => {
        if (viewStack.length > 0) {
            // Prevent the back navigation and use our view stack instead
            history.pushState(null, '', window.location.href);
            popView();
        }
    });

    // Push initial state to enable back button interception
    if (window.innerWidth <= CONFIG.MOBILE_BREAKPOINT) {
        history.pushState(null, '', window.location.href);
    }

    // Initialize
    init();
});

function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
}
</script>
