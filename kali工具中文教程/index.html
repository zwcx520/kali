<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kali Linux 工具中文教程文档</title>
    <meta name="description" content="Kali Linux 全部工具中文使用教程文档站 - 覆盖信息收集、漏洞分析、Web渗透、密码攻击、无线攻击、逆向工程、取证等所有分类">
    <!-- Bootstrap 5 CSS (本地) -->
    <link href="assets/lib/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 (本地) -->
    <link href="assets/lib/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts (本地) -->
    <link href="assets/lib/css/noto-sans-sc.css" rel="stylesheet">
    <link href="assets/lib/css/jetbrains-mono.css" rel="stylesheet">
    <style>
        :root {
            --kali-bg: #0d1117;
            --kali-bg2: #161b22;
            --kali-surface: #1c2332;
            --kali-border: #30363d;
            --kali-text: #e6edf3;
            --kali-muted: #8b949e;
            --kali-blue: #367bf0;
            --kali-cyan: #2dd4bf;
            --kali-purple: #a855f7;
            --kali-green: #3fb950;
            --kali-red: #f85149;
            --kali-orange: #d29922;
            --kali-pink: #ec4899;
            --tabbar-h: 56px;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--kali-bg);
            color: var(--kali-text);
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        code, pre, .mono { font-family: 'JetBrains Mono', monospace; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--kali-bg2); }
        ::-webkit-scrollbar-thumb { background: var(--kali-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--kali-muted); }

        /* ===== 顶部导航栏 ===== */
        .topbar {
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--kali-border);
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--kali-text);
            font-weight: 700;
            font-size: 1.15rem;
        }

        .topbar-logo .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--kali-blue), var(--kali-cyan));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            color: #fff;
        }

        .search-box {
            position: relative;
            max-width: 480px;
            flex: 1;
        }

        .search-box input {
            background: var(--kali-bg2);
            border: 1px solid var(--kali-border);
            color: var(--kali-text);
            border-radius: 8px;
            padding: 8px 16px 8px 40px;
            width: 100%;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--kali-blue);
            box-shadow: 0 0 0 3px rgba(54, 123, 240, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: var(--kali-muted);
            font-size: 0.9rem;
        }

        /* 移动端菜单按钮 - 桌面端隐藏 */
        .menu-toggle {
            display: none;
            background: var(--kali-bg2);
            border: 1px solid var(--kali-border);
            color: var(--kali-text);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
        }

        /* ===== 布局 ===== */
        .layout {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        /* ===== 侧边栏（桌面端）===== */
        .sidebar {
            width: 260px;
            background: var(--kali-bg2);
            border-right: 1px solid var(--kali-border);
            padding: 1rem 0;
            overflow-y: auto;
            position: sticky;
            top: 65px;
            height: calc(100vh - 65px);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-section { padding: 0 0.75rem; }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--kali-muted);
            padding: 0.75rem 0.75rem 0.4rem;
            font-weight: 700;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border-radius: 6px;
            color: var(--kali-text);
            text-decoration: none;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .sidebar-link:hover {
            background: var(--kali-surface);
            color: var(--kali-cyan);
        }

        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(54,123,240,0.15), rgba(45,212,191,0.1));
            color: var(--kali-cyan);
            border-left: 3px solid var(--kali-cyan);
        }

        .sidebar-link i { width: 20px; text-align: center; font-size: 0.9rem; }

        .sidebar-badge {
            margin-left: auto;
            font-size: 0.7rem;
            background: var(--kali-surface);
            padding: 1px 7px;
            border-radius: 10px;
            color: var(--kali-muted);
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            padding: 1.5rem;
            min-width: 0;
        }

        /* Hero 统计区 */
        .hero-section {
            background: linear-gradient(135deg, rgba(54,123,240,0.08), rgba(45,212,191,0.05));
            border: 1px solid var(--kali-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .hero-section h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .hero-section p { color: var(--kali-muted); font-size: 0.9rem; margin-bottom: 1.2rem; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--kali-bg2);
            border: 1px solid var(--kali-border);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-num { font-size: 1.8rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .stat-card .stat-label { font-size: 0.75rem; color: var(--kali-muted); margin-top: 4px; }

        /* 分类标签 */
        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
            margin-top: 0.5rem;
        }

        .category-header .cat-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }

        .category-header h2 { font-size: 1.3rem; font-weight: 700; margin: 0; }
        .category-header .cat-desc { font-size: 0.8rem; color: var(--kali-muted); }

        /* 工具卡片网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .tool-card {
            background: var(--kali-bg2);
            border: 1px solid var(--kali-border);
            border-radius: 12px;
            padding: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--card-accent, var(--kali-blue));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tool-card:hover {
            border-color: var(--card-accent, var(--kali-blue));
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .tool-card:hover::before { opacity: 1; }

        .tool-card-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 0.6rem; }

        .tool-icon {
            width: 40px; height: 40px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .tool-card h3 { font-size: 0.95rem; font-weight: 600; margin: 0; word-break: break-all; }
        .tool-card .tool-cn { font-size: 0.78rem; color: var(--kali-muted); margin-top: 2px; }
        .tool-card .tool-desc {
            font-size: 0.82rem; color: var(--kali-muted); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .tool-card .tool-tags { display: flex; gap: 6px; margin-top: 0.6rem; flex-wrap: wrap; }
        .tool-tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 4px; background: var(--kali-surface); color: var(--kali-muted); }

        /* ===== 视图容器（用于APP式导航）===== */
        .app-view { display: none; }
        .app-view.active { display: block; }

        /* ===== 全屏工具详情页 ===== */
        .tool-detail-page {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--kali-bg);
            z-index: 2000;
            overflow-y: auto;
            animation: pageIn 0.3s ease;
        }

        .tool-detail-page.active { display: block; }

        @keyframes pageIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 移动端详情页底部留出导航栏空间 */
        @media (max-width: 991px) {
            .tool-detail-page {
                bottom: var(--tabbar-h);
            }
        }

        .detail-close-bar {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            z-index: 10;
            pointer-events: none;
        }

        .detail-close-btn {
            pointer-events: auto;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--kali-border);
            color: var(--kali-text);
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            text-decoration: none;
            transition: all 0.2s;
        }

        .detail-close-btn:hover {
            background: var(--kali-red);
            border-color: var(--kali-red);
            color: #fff;
            transform: rotate(90deg);
        }

        .detail-container { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

        .detail-head {
            display: flex; align-items: flex-start; gap: 20px;
            margin-bottom: 2rem; padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--kali-border);
        }

        .detail-head .tool-icon-lg {
            width: 72px; height: 72px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; flex-shrink: 0;
        }

        .detail-head h1 { font-size: 1.8rem; margin: 0 0 6px; font-weight: 700; }
        .detail-head .detail-cn { color: var(--kali-muted); font-size: 1rem; margin-bottom: 8px; }

        .detail-section { margin-bottom: 2rem; }

        .detail-section h4 {
            font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--kali-cyan); margin-bottom: 0.8rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            padding-bottom: 0.5rem; border-bottom: 1px solid var(--kali-border);
        }

        .detail-section p, .detail-section li { font-size: 0.92rem; line-height: 1.8; color: var(--kali-text); }
        .detail-section ul { padding-left: 1.2rem; }
        .detail-section code {
            background: var(--kali-bg2); padding: 2px 6px; border-radius: 4px;
            font-size: 0.85rem; color: var(--kali-green);
        }

        .cmd-block {
            background: var(--kali-bg2); border: 1px solid var(--kali-border);
            border-left: 3px solid var(--kali-cyan); border-radius: 8px;
            padding: 0.8rem 1rem; margin-bottom: 0.5rem;
            display: flex; align-items: flex-start; gap: 12px;
            transition: border-color 0.2s;
        }

        .cmd-block:hover { border-left-color: var(--kali-blue); }

        .cmd-block .cmd-num {
            background: var(--kali-surface); color: var(--kali-cyan);
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
            min-width: 28px; height: 28px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        .cmd-block code { color: var(--kali-green); font-size: 0.82rem; flex: 1; word-break: break-all; }
        .cmd-block .cmd-desc { color: var(--kali-muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.5; }
        .cmd-prefix { color: var(--kali-cyan); user-select: none; }
        .cmd-count-badge {
            background: var(--kali-surface); color: var(--kali-cyan); font-size: 0.7rem;
            padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 4px;
        }

        .ext-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--kali-blue); text-decoration: none; font-size: 0.85rem;
            padding: 6px 14px; border: 1px solid var(--kali-border); border-radius: 8px;
            transition: all 0.2s;
        }

        .ext-link:hover { background: var(--kali-bg2); border-color: var(--kali-blue); }

        /* 加载动画 */
        .loading-spinner { text-align: center; padding: 3rem; color: var(--kali-muted); }
        .loading-spinner i { font-size: 2rem; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 空状态 */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--kali-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; }

        /* 返回顶部 */
        .back-top {
            position: fixed; bottom: 24px; right: 24px;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--kali-blue); color: #fff; border: none;
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 4px 12px rgba(54,123,240,0.4);
            transition: transform 0.2s;
        }
        .back-top:hover { transform: scale(1.1); }
        .back-top.show { display: flex; }

        /* 分类图标背景色 */
        .bg-blue { background: rgba(54,123,240,0.15); color: var(--kali-blue); }
        .bg-cyan { background: rgba(45,212,191,0.15); color: var(--kali-cyan); }
        .bg-purple { background: rgba(168,85,247,0.15); color: var(--kali-purple); }
        .bg-green { background: rgba(63,185,80,0.15); color: var(--kali-green); }
        .bg-red { background: rgba(248,81,73,0.15); color: var(--kali-red); }
        .bg-orange { background: rgba(210,153,34,0.15); color: var(--kali-orange); }
        .bg-pink { background: rgba(236,72,153,0.15); color: var(--kali-pink); }

        /* 移动端遮罩 */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1029;
        }
        .sidebar-overlay.active { display: block; }

        /* ===== 移动端底部导航栏 (APP Tab Bar) ===== */
        .mobile-tabbar {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--tabbar-h);
            background: rgba(13, 17, 23, 0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--kali-border);
            z-index: 2100;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .mobile-tabbar-inner {
            display: flex;
            height: var(--tabbar-h);
            max-width: 500px;
            margin: 0 auto;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--kali-muted);
            cursor: pointer;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .tab-item i { font-size: 1.15rem; }
        .tab-item span { font-size: 0.65rem; font-weight: 500; }

        .tab-item.active {
            color: var(--kali-cyan);
        }

        .tab-item.active i {
            transform: scale(1.1);
            transition: transform 0.2s;
        }

        /* ===== 移动端分类页面 ===== */
        .mobile-category-page {
            padding: 1rem 1rem calc(var(--tabbar-h) + 1rem);
        }

        .mobile-category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .mobile-cat-card {
            background: var(--kali-bg2);
            border: 1px solid var(--kali-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-cat-card:active {
            transform: scale(0.96);
        }

        .mobile-cat-card .cat-icon-box {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .mobile-cat-card .cat-info { min-width: 0; }
        .mobile-cat-card .cat-name { font-size: 0.85rem; font-weight: 600; }
        .mobile-cat-card .cat-count { font-size: 0.7rem; color: var(--kali-muted); }

        /* ===== 响应式 ===== */
        @media (max-width: 991px) {
            .menu-toggle { display: none; }
            .sidebar { display: none; }
            .sidebar-overlay { display: none !important; }
            .mobile-tabbar { display: block; }
            .main-content { padding: 1rem 1rem calc(var(--tabbar-h) + 1rem); }
            .back-top { bottom: calc(var(--tabbar-h) + 16px); }
            .topbar-logo span { font-size: 1rem; }
            .search-box { max-width: none; }
            /* 详情页底部留出 tabbar 空间 */
            .detail-container { padding-bottom: calc(var(--tabbar-h) + 2rem); }
        }

        @media (max-width: 575px) {
            .tools-grid { grid-template-columns: 1fr; }
            .hero-section { padding: 1.2rem; }
            .hero-section h1 { font-size: 1.3rem; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .detail-head { flex-direction: column; gap: 12px; }
            .detail-head .tool-icon-lg { width: 56px; height: 56px; font-size: 1.5rem; }
            .detail-head h1 { font-size: 1.4rem; }
            .detail-container { padding: 1rem 1rem calc(var(--tabbar-h) + 2rem); }
            .topbar-logo span { font-size: 0.9rem; }
            .topbar-logo .logo-icon { width: 32px; height: 32px; font-size: 1rem; }
            .search-box input { font-size: 0.85rem; padding: 7px 12px 7px 36px; }
            .search-box i { left: 12px; }
        }

        /* footer */
        .site-footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--kali-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--kali-border);
            margin-top: 2rem;
        }
        .site-footer a { color: var(--kali-cyan); text-decoration: none; }

        /* 提示框 */
        .alert-custom {
            background: rgba(168,85,247,0.1);
            border: 1px solid rgba(168,85,247,0.3);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            font-size: 0.82rem;
            color: var(--kali-purple);
            margin-bottom: 1rem;
        }
        .alert-custom i { margin-right: 6px; }
    </style>
</head>
<body>

<!-- ===== 顶部导航栏 ===== -->
<nav class="topbar">
    <div class="d-flex align-items-center gap-3 px-3 py-2">
        <a href="#" class="topbar-logo" onclick="mobileSwitchTab('home'); return false;">
            <span class="logo-icon"><i class="fas fa-dragon"></i></span>
            <span class="d-none d-sm-inline">Kali Linux 工具中文教程</span>
        </a>
        <div class="search-box mx-auto">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="搜索工具名称或功能..." oninput="handleSearch(this.value)">
        </div>
    </div>
</nav>

<div class="layout">
    <!-- ===== 侧边栏（桌面端）===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">导航</div>
            <a class="sidebar-link active" onclick="showAll()">
                <i class="fas fa-th-large"></i> 全部工具
                <span class="sidebar-badge" id="totalCount">0</span>
            </a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">工具分类</div>
            <div id="categoryNav"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">关于</div>
            <a class="sidebar-link" onclick="showAbout()">
                <i class="fas fa-info-circle"></i> 关于本站
            </a>
            <a class="sidebar-link" href="https://www.kali.org/tools/" target="_blank">
                <i class="fas fa-external-link-alt"></i> 官方工具站
            </a>
        </div>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main class="main-content">
        <!-- 首页视图 -->
        <div class="app-view active" id="view-home">
            <div id="contentArea">
